name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - run: npm ci
      - run: npm --prefix functions ci
      - run: npm test
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install the JavaScript core that Gradle bundles
        run: npm ci
      - name: Placeholder signing config (unit tests never sign)
        working-directory: android
        run: |
          printf '%s\n' 'storeFile=ci-placeholder.keystore' 'storePassword=placeholder' \
            'keyAlias=placeholder' 'keyPassword=placeholder' > keystore.properties
      - name: Engine, data and design unit tests
        working-directory: android
        run: ./gradlew --no-daemon :engine:test :data:testDebugUnitTest :design:testDebugUnitTest
